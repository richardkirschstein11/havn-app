<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141414">
<title>HAVN — Coming soon</title>
<meta name="description" content="HAVN — Rest, on demand. Private recovery rooms by the hour. Coming soon.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HAVN">
<meta property="og:title" content="HAVN — Rest, on demand.">
<meta property="og:description" content="Private recovery rooms by the hour. Coming soon.">
<meta property="og:url" content="https://havn.rest/">
<meta property="og:image" content="https://havn.rest/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>
/* Coming-soon placeholder. Same palette and type as the HAVN app splash: ink background, Georgia wordmark, vermilion claim. */
:root{--ink:#141414;--paper:#F4F2EE;--grey:#A8A39C;--verm:#C9251B;
  --sans:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;--serif:Georgia,"Times New Roman",Times,serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 0 96px;animation:in .6s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,12vw,72px);line-height:1;letter-spacing:.28em;text-indent:.28em;margin:0}
.rule{display:block;width:40px;height:3px;background:var(--verm);margin:26px auto 0}
.claim{color:var(--verm);font-size:18px;margin:26px 0 0}
.sub{color:var(--grey);margin:8px 0 0;max-width:28em;text-wrap:balance}
.foot{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);font-weight:400}
@media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
<main>
  <h1>HAVN</h1>
  <span class="rule" aria-hidden="true"></span>
  <p class="claim">Rest, on demand.</p>
  <p class="sub">Private recovery rooms by the hour.</p>
</main>
<footer class="foot"><span class="lab">Coming soon</span></footer>
</body>
</html>
